<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold Gradients -->
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="25%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F3E5AB"/>
      <stop offset="75%" stop-color="#B08D22"/>
      <stop offset="100%" stop-color="#7A5C10"/>
    </linearGradient>
    
    <linearGradient id="goldShine" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#B08D22"/>
      <stop offset="30%" stop-color="#FFE89E"/>
      <stop offset="50%" stop-color="#FFF9E6"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8A6D1C"/>
    </linearGradient>

    <radialGradient id="glitterPattern" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF9E6"/>
      <stop offset="40%" stop-color="#E5C158"/>
      <stop offset="70%" stop-color="#B08D22"/>
      <stop offset="100%" stop-color="#8A6D1C"/>
    </radialGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="3" stdDeviation="4" flood-color="#43281C" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Ring and Background -->
  <circle cx="250" cy="250" r="235" fill="none" stroke="url(#goldLinear)" stroke-width="3" opacity="0.9" />
  <circle cx="250" cy="250" r="232" fill="#FAF6F0" fill-opacity="0.35" />

  <!-- Sparkle Stars -->
  <g fill="url(#goldShine)" filter="url(#dropShadow)">
    <!-- Top Left -->
    <path d="M 120 230 Q 125 230 125 225 Q 125 230 130 230 Q 125 230 125 235 Q 125 230 120 230 Z" transform="scale(1.8) translate(-50,-80)"/>
    <!-- Far Left -->
    <path d="M 80 235 Q 85 235 85 230 Q 85 235 90 235 Q 85 235 85 240 Q 85 235 80 235 Z" transform="scale(1.4) translate(-25,-60)"/>
    <!-- Top Right -->
    <path d="M 370 145 Q 375 145 375 140 Q 375 145 380 145 Q 375 145 375 150 Q 375 145 370 145 Z" transform="scale(1.6) translate(-130,-40)"/>
    <!-- Far Right -->
    <path d="M 410 215 Q 415 215 415 210 Q 415 215 420 215 Q 415 215 415 220 Q 415 215 410 215 Z" transform="scale(1.5) translate(-140,-60)"/>
    <path d="M 425 250 Q 429 250 429 246 Q 429 250 433 250 Q 429 250 429 254 Q 429 250 425 250 Z" transform="scale(1.4) translate(-145,-70)"/>
  </g>

  <!-- Nail Polish Bottle (Left) -->
  <g id="polishBottle" transform="translate(100, 145) rotate(-18)" filter="url(#dropShadow)">
    <!-- Cap -->
    <rect x="20" y="5" width="14" height="35" rx="3" fill="url(#goldShine)" stroke="#8A6D1C" stroke-width="1.5" />
    <rect x="18" y="38" width="18" height="5" rx="1.5" fill="url(#goldLinear)" />
    <!-- Glass Bottle Body -->
    <path d="M 12 43 C 12 43, 8 55, 8 75 C 8 85, 14 90, 27 90 C 40 90, 46 85, 46 75 C 46 55, 42 43, 42 43 Z" fill="url(#goldShine)" stroke="#8A6D1C" stroke-width="1.5" />
    <!-- Highlight Reflection -->
    <path d="M 15 50 Q 14 70 17 80" stroke="#FFF9E6" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>
  </g>

  <!-- Cosmetic Cream Jar (Right) -->
  <g id="creamJar" transform="translate(325, 160) rotate(12)" filter="url(#dropShadow)">
    <!-- Jar Lid -->
    <ellipse cx="40" cy="18" rx="38" ry="14" fill="url(#goldShine)" stroke="#8A6D1C" stroke-width="1.5" />
    <path d="M 2 18 L 2 30 C 2 38, 18 44, 40 44 C 62 44, 78 38, 78 30 L 78 18 Z" fill="url(#goldLinear)" stroke="#8A6D1C" stroke-width="1.5"/>
    <!-- Ribbed details on lid -->
    <line x1="12" y1="22" x2="12" y2="34" stroke="#FFF9E6" stroke-width="1.2" opacity="0.7"/>
    <line x1="26" y1="24" x2="26" y2="37" stroke="#FFF9E6" stroke-width="1.2" opacity="0.7"/>
    <line x1="40" y1="25" x2="40" y2="38" stroke="#FFF9E6" stroke-width="1.2" opacity="0.7"/>
    <!-- Jar Base -->
    <path d="M 6 36 L 6 52 C 6 62, 20 68, 40 68 C 60 68, 74 62, 74 52 L 74 36 Z" fill="url(#goldShine)" stroke="#8A6D1C" stroke-width="1.5"/>
  </g>

  <!-- 5 Golden Manicured Nails/Fingers in Fan Layout -->
  <g id="nailsGroup" filter="url(#dropShadow)">
    <!-- Finger 1 (Thumb Left) -->
    <g transform="translate(162, 115)">
      <path d="M 5 95 C 2 60, 2 35, 12 18 C 17 8, 28 8, 33 18 C 42 35, 42 60, 40 95 Z" fill="url(#goldLinear)" stroke="#8A6D1C" stroke-width="1.5" />
      <path d="M 12 25 C 16 14, 28 14, 32 25 C 34 38, 34 60, 32 75 C 28 78, 16 78, 12 75 Z" fill="url(#goldShine)" />
      <!-- Cuticle Arc -->
      <path d="M 12 72 Q 22 76 32 72" fill="none" stroke="#8A6D1C" stroke-width="1.2"/>
    </g>

    <!-- Finger 2 (Index) -->
    <g transform="translate(202, 100)">
      <path d="M 5 110 C 2 70, 2 30, 13 12 C 18 4, 29 4, 34 12 C 44 30, 44 70, 41 110 Z" fill="url(#goldLinear)" stroke="#8A6D1C" stroke-width="1.5" />
      <path d="M 12 20 C 17 10, 28 10, 33 20 C 36 38, 36 68, 33 85 C 28 88, 17 88, 12 85 Z" fill="url(#goldShine)" />
      <path d="M 12 82 Q 22.5 86 33 82" fill="none" stroke="#8A6D1C" stroke-width="1.2"/>
    </g>

    <!-- Finger 3 (Middle - Glitter Gold Stiletto/Oval) -->
    <g transform="translate(247, 92)">
      <path d="M 5 118 C 2 75, 2 25, 13 8 C 18 1, 30 1, 35 8 C 46 25, 46 75, 43 118 Z" fill="url(#glitterPattern)" stroke="#8A6D1C" stroke-width="1.5" />
      <!-- Glitter texture dots -->
      <circle cx="24" cy="22" r="1.5" fill="#FFF" opacity="0.9"/>
      <circle cx="18" cy="35" r="1.2" fill="#FFF" opacity="0.8"/>
      <circle cx="30" cy="40" r="1.4" fill="#FFF" opacity="0.85"/>
      <circle cx="21" cy="55" r="1.6" fill="#FFF" opacity="0.9"/>
      <circle cx="27" cy="70" r="1.3" fill="#FFF" opacity="0.75"/>
      <circle cx="16" cy="78" r="1.4" fill="#FFF" opacity="0.85"/>
      <path d="M 13 90 Q 24 94 35 90" fill="none" stroke="#7A5C10" stroke-width="1.5"/>
    </g>

    <!-- Finger 4 (Ring) -->
    <g transform="translate(295, 104)">
      <path d="M 5 106 C 2 68, 2 28, 13 12 C 18 4, 29 4, 34 12 C 44 28, 44 68, 41 106 Z" fill="url(#goldLinear)" stroke="#8A6D1C" stroke-width="1.5" />
      <path d="M 12 20 C 17 10, 28 10, 33 20 C 36 38, 36 65, 33 82 C 28 85, 17 85, 12 82 Z" fill="url(#goldShine)" />
      <path d="M 12 79 Q 22.5 83 33 79" fill="none" stroke="#8A6D1C" stroke-width="1.2"/>
    </g>

    <!-- Finger 5 (Pinky Right) -->
    <g transform="translate(335, 125)">
      <path d="M 5 85 C 2 55, 2 30, 11 16 C 16 7, 26 7, 31 16 C 39 30, 39 55, 37 85 Z" fill="url(#goldLinear)" stroke="#8A6D1C" stroke-width="1.5" />
      <path d="M 11 22 C 15 13, 25 13, 29 22 C 31 35, 31 55, 29 70 C 25 73, 15 73, 11 70 Z" fill="url(#goldShine)" />
      <path d="M 11 67 Q 20 71 29 67" fill="none" stroke="#8A6D1C" stroke-width="1.2"/>
    </g>
  </g>

  <!-- Center Signature Typography "Pimp My Nails" -->
  <g id="typographyPimpMyNails" filter="url(#dropShadow)" text-anchor="middle">
    <!-- Outer Golden 3D Stroke Effect -->
    <text x="250" y="248" font-family="'Cormorant Garamond', 'Playfair Display', serif" font-weight="700" font-style="italic" font-size="78" fill="#43281C" letter-spacing="1">Pimp</text>
    <text x="250" y="246" font-family="'Cormorant Garamond', 'Playfair Display', serif" font-weight="700" font-style="italic" font-size="78" fill="url(#goldLinear)" letter-spacing="1" stroke="#8A6D1C" stroke-width="1.5">Pimp</text>

    <!-- "my" center script -->
    <text x="249" y="286" font-family="'Playfair Display', 'Brush Script MT', cursive" font-style="italic" font-size="44" fill="#43281C">my</text>
    <text x="248" y="284" font-family="'Playfair Display', 'Brush Script MT', cursive" font-style="italic" font-size="44" fill="url(#goldShine)" stroke="#8A6D1C" stroke-width="1">my</text>

    <!-- "Nails" grand cursive flow with elegant swash -->
    <text x="250" y="362" font-family="'Cormorant Garamond', 'Playfair Display', serif" font-weight="700" font-style="italic" font-size="94" fill="#43281C" letter-spacing="-1">Nails</text>
    <text x="250" y="358" font-family="'Cormorant Garamond', 'Playfair Display', serif" font-weight="700" font-style="italic" font-size="94" fill="url(#goldLinear)" letter-spacing="-1" stroke="#7A5C10" stroke-width="1.8">Nails</text>

    <!-- Underline Gold Ribbon Swash -->
    <path d="M 110 300 C 90 325, 80 340, 105 348 C 130 355, 180 330, 230 365 C 290 405, 375 390, 400 340 C 408 322, 385 330, 360 345 C 315 370, 240 370, 205 348 C 170 326, 125 335, 115 315 Z" fill="url(#goldShine)" stroke="#8A6D1C" stroke-width="1.5" />
  </g>

  <!-- Subtitle "By Solam Beauty" -->
  <g id="bySolamBeauty" text-anchor="middle" filter="url(#dropShadow)">
    <text x="250" y="420" font-family="'Cormorant Garamond', serif" font-weight="600" font-style="italic" font-size="28" fill="#43281C" letter-spacing="3">By Solam Beauty</text>
    <text x="250" y="419" font-family="'Cormorant Garamond', serif" font-weight="600" font-style="italic" font-size="28" fill="url(#goldLinear)" letter-spacing="3" stroke="#8A6D1C" stroke-width="0.5">By Solam Beauty</text>
  </g>

  <!-- Fine bottom heart flourish -->
  <g transform="translate(250, 442) scale(0.8)" fill="url(#goldShine)">
    <path d="M 0 5 C -2 0, -8 0, -8 5 C -8 11, 0 16, 0 16 C 0 16, 8 11, 8 5 C 8 0, 2 0, 0 5 Z"/>
  </g>
</svg>
